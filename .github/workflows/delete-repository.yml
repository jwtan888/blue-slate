name: Delete repository on October 15

on:
  # GitHub cron uses UTC: 14:30 and 15:30 UTC are 22:30 and 23:30 in Malaysia.
  schedule:
    - cron: '30 14 15 10 *'
    - cron: '30 15 15 10 *'

permissions: {}

jobs:
  delete-repository:
    if: github.repository == 'jwtan888/blue-slate'
    runs-on: ubuntu-latest
    steps:
      - name: Delete repository on the Malaysia removal date
        env:
          GH_TOKEN: ${{ secrets.DELETE_REPO_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$(TZ=Asia/Kuala_Lumpur date +%F)" != "2026-10-15" ]; then
            echo "Not the scheduled removal date in Malaysia; skipping."
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "DELETE_REPO_TOKEN is not configured." >&2
            exit 1
          fi
          gh api --method DELETE "/repos/${GH_REPOSITORY}"
